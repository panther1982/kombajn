{% extends "base.html" %}
{% block title %}Logowanie — Kombajn{% endblock %}
{% block content_guest %}
<div style="max-width:380px; margin:6vh auto 0">
  <h1>Zaloguj się</h1>
  <p class="sub">Panel Kombajn</p>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <div class="card">
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="username">
      <label for="password">Hasło</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <div style="margin-top:20px"><button class="btn" type="submit">Zaloguj się</button></div>
    </form>
  </div>
</div>
{% endblock %}
