<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kombajn{% endblock %}</title>
  <style>
    :root {
      --bg:#f5f5f7; --sidebar:#e9e9ed; --card:#ffffff; --field:#ffffff;
      --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#8e8e93;
      --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.06);
      --accent:#007aff; --accent-ink:#fff; --accent-soft:rgba(0,122,255,.12);
      --ok:#1d7a4a; --ok-bg:#e3f5ea;
      --danger:#c0392b; --danger-bg:#fdeceb;
      --shadow:0 1px 2px rgba(0,0,0,.05);
      --r:6px; --r-card:11px;
    }
    html[data-theme="dark"] {
      --bg:#1c1c1e; --sidebar:#161618; --card:#2c2c2e; --field:#1f1f21;
      --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#8e8e93;
      --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.08);
      --accent:#0a84ff; --accent-ink:#fff; --accent-soft:rgba(10,132,255,.22);
      --ok:#6fdba0; --ok-bg:rgba(52,199,89,.16);
      --danger:#ff6961; --danger-bg:rgba(255,69,58,.16);
      --shadow:0 1px 2px rgba(0,0,0,.30);
    }
    *{box-sizing:border-box}
    body{
      margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--ink);
      font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* ---------- panel boczny ---------- */
    .sidebar{
      width:212px;flex-shrink:0;background:var(--sidebar);
      border-right:1px solid var(--line-2);
      display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    }
    .sidebar nav{padding:26px 10px 8px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
    .sec{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;
         text-transform:uppercase;padding:14px 10px 5px}
    .sidebar nav a{
      display:block;padding:5px 10px;border-radius:var(--r);color:var(--ink);
      font-size:13px;line-height:20px;text-decoration:none;
    }
    .sidebar nav a:hover{background:rgba(120,120,128,.12);text-decoration:none}
    .sidebar nav a.active{background:var(--accent);color:var(--accent-ink);font-weight:500}
    .sidebar nav a.active:hover{background:var(--accent)}
    .acct{padding:10px 12px;border-top:1px solid var(--line-2);display:flex;
          align-items:center;justify-content:space-between;gap:8px}
    .acct .em{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct .rl{font-size:11px;color:var(--ink-3)}
    .acct form{margin:0}
    .acct button{
      border:1px solid var(--line);background:var(--card);color:var(--ink);
      font:inherit;font-size:12px;padding:3px 9px;border-radius:var(--r);
      cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;
    }
    .acct button:hover{background:rgba(120,120,128,.10)}

    /* ---------- pasek narzędzi ---------- */
    .wrap{flex:1;display:flex;flex-direction:column;min-width:0}
    .toolbar{
      height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;background:var(--bg);border-bottom:1px solid var(--line-2);
      position:sticky;top:0;z-index:5;
    }
    .toolbar .date{font-size:12px;color:var(--ink-2)}
    .seg{display:inline-flex;background:rgba(120,120,128,.14);border-radius:7px;padding:2px}
    .seg button{
      border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;
      padding:3px 11px;border-radius:5px;cursor:pointer;
    }
    .seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:500}
    main{padding:24px 22px 40px;max-width:940px;width:100%}

    /* ---------- typografia ---------- */
    h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px}
    h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
    .sub{color:var(--ink-2);font-size:13px;margin:0 0 22px}
    .hint{font-weight:400;color:var(--ink-3);font-size:12px}

    /* ---------- karty (grupowane, jak w Ustawieniach) ---------- */
    .card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);
          padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
    .tile{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card);
          padding:14px 16px;box-shadow:var(--shadow)}
    .tile .lbl{font-size:12px;color:var(--ink-2)}
    .tile .val{font-size:27px;font-weight:600;letter-spacing:-.025em;margin-top:2px}
    .balance{font-size:27px;font-weight:600;letter-spacing:-.025em}
    .shop-item{display:flex;justify-content:space-between;align-items:center;gap:12px;
               padding:11px 0;border-top:1px solid var(--line-2)}
    .shop-item:first-child{border-top:0}

    /* ---------- formularze ---------- */
    label{display:block;font-size:13px;font-weight:500;margin:15px 0 5px}
    input[type=text],input[type=email],input[type=password],textarea,select{
      width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);
      background:var(--field);color:var(--ink);font:inherit;font-size:13px;
    }
    select{padding:5px 8px}
    textarea{resize:vertical;line-height:1.5}
    textarea.prompt{min-height:250px}
    textarea.mono{min-height:110px}
    textarea.prompt,textarea.mono,.masked{
      font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;
    }
    .masked{color:var(--ink-2)}
    input:focus,textarea:focus,select:focus{
      outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
    }
    a:focus-visible,button:focus-visible,summary:focus-visible{
      outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r);
    }

    /* ---------- przyciski ---------- */
    .btn{
      display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;
      border-radius:var(--r);padding:6px 14px;font:500 13px/1.4 inherit;cursor:pointer;
      text-decoration:none;box-shadow:var(--shadow);
    }
    .btn:hover{filter:brightness(1.06);text-decoration:none}
    .btn:active{filter:brightness(.94)}
    .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
    .btn.ghost:hover{background:rgba(120,120,128,.10);filter:none}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
          font-weight:500;background:var(--accent-soft);color:var(--accent)}

    /* ---------- komunikaty ---------- */
    .flash{padding:9px 13px;border-radius:var(--r);margin-bottom:14px;font-size:13px;
           border:1px solid transparent}
    .flash.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--line-2)}
    .flash.err{background:var(--danger-bg);color:var(--danger);border-color:var(--line-2)}

    /* ---------- tabele ---------- */
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead tr{background:transparent}
    th{font-weight:500;color:var(--ink-2);font-size:12px;text-align:left}

    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    @media (max-width:760px){
      body{flex-direction:column}
      .sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line-2)}
      .sidebar nav{flex-direction:row;flex-wrap:wrap;padding:8px}
      .sec{display:none}
      main{padding:18px 14px 32px}
    }
  </style>
</head>
<body>
  {% if user %}
  {% set p = request.url.path %}
  <aside class="sidebar">
    <nav>
      <a href="/" class="{% if p == '/' %}active{% endif %}">Pulpit</a>

      <div class="sec">Katalog</div>
      <a href="/products"   class="{% if p.startswith('/products') %}active{% endif %}">Produkty</a>
      <a href="/generate"   class="{% if p.startswith('/generate') %}active{% endif %}">Opisy</a>
      <a href="/images"     class="{% if p.startswith('/images') %}active{% endif %}">Zdjęcia</a>
      <a href="/categories" class="{% if p.startswith('/categories') %}active{% endif %}">Kategorie</a>

      {% if user.role == 'superadmin' %}
      <div class="sec">Administracja</div>
      <a href="/admin" class="{% if p.startswith('/admin') %}active{% endif %}">Użytkownicy</a>
      {% endif %}
    </nav>
    <div class="acct">
      <div style="min-width:0">
        <div class="em">{{ user.email }}</div>
        <div class="rl">{{ user.role }}</div>
      </div>
      <form method="post" action="/logout"><button type="submit">Wyloguj</button></form>
    </div>
  </aside>

  <div class="wrap">
    <header class="toolbar">
      <div class="date" id="today"></div>
      <div class="seg" role="group" aria-label="Motyw">
        <button type="button" id="tLight" aria-pressed="true">Jasny</button>
        <button type="button" id="tDark" aria-pressed="false">Ciemny</button>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </div>
  {% else %}
  <div class="wrap"><main style="max-width:380px;margin:9vh auto 0">{% block content_guest %}{% endblock %}</main></div>
  {% endif %}

  <script>
    (function(){
      var html=document.documentElement,saved=null;
      try{saved=localStorage.getItem('kombajn-theme')}catch(e){}
      if(saved)html.setAttribute('data-theme',saved);
      var L=document.getElementById('tLight'),D=document.getElementById('tDark');
      function sync(){
        var dark=html.getAttribute('data-theme')==='dark';
        if(L)L.setAttribute('aria-pressed',String(!dark));
        if(D)D.setAttribute('aria-pressed',String(dark));
      }
      function set(mode){
        html.setAttribute('data-theme',mode);
        try{localStorage.setItem('kombajn-theme',mode)}catch(e){}
        sync();
      }
      if(L)L.addEventListener('click',function(){set('light')});
      if(D)D.addEventListener('click',function(){set('dark')});
      sync();
      var d=document.getElementById('today');
      if(d)d.textContent=new Date().toLocaleDateString('pl-PL',
        {weekday:'long',year:'numeric',month:'long',day:'numeric'});
    })();
  </script>
</body>
</html>
